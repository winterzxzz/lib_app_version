name: app_update_check
description: "Check the App Store / Google Play for a newer version, show an optional or forced update dialog, and detect TestFlight builds. Zero dependencies."
version: 1.0.0
homepage: https://github.com/winterzxzz/app_update_check
repository: https://github.com/winterzxzz/app_update_check
issue_tracker: https://github.com/winterzxzz/app_update_check/issues
topics:
  - version
  - update
  - testflight
  - app-store
  - play-store

environment:
  sdk: ^3.8.0
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.winterzxzz.app_update_check
        pluginClass: AppUpdateCheckPlugin
      ios:
        pluginClass: AppUpdateCheckPlugin
